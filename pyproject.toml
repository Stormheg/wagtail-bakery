[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=61" ]

[project]
name = "wagtail-bakery"
version = "0.9.0"
description = "A set of helpers for baking your Django Wagtail site out as flat files."
readme = "README.md"
authors = [
  { name = "Wagtail Nest team", email = "hello@wagtail.org" },
]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Framework :: Wagtail",
  "Framework :: Wagtail :: 7",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "django-bakery~=0.13.5",
  "wagtail>=7",
]
optional-dependencies.test = [
  "black>=26,<27",
  "coverage[toml]>=7.13.5,<8",
  "factory-boy",
  "flake8",
  "flake8-black",
  "flake8-isort",
  "isort",
  "pytest",
  "pytest-cov",
  "pytest-django",
  # `fs` (transitive via django-bakery) still calls pkg_resources.declare_namespace,
  # which setuptools 81+ removed. Pin until PyFilesystem2 ships a fix.
  "setuptools<81",
]
urls."Issue tracker" = "https://github.com/wagtail-nest/wagtail-bakery/issues/"
urls.Changelog = "https://github.com/wagtail-nest/wagtail-bakery/blob/main/CHANGELOG.md"
urls.Homepage = "https://github.com/wagtail-nest/wagtail-bakery/"
urls.Source = "https://github.com/wagtail-nest/wagtail-bakery/"

[tool.setuptools]
packages.find.where = [ "src" ]

[tool.black]
line-length = 88

[tool.isort]
line_length = 88
multi_line_output = 3
use_parentheses = true
include_trailing_comma = true
force_grid_wrap = 0

[tool.pytest]
ini_options.testpaths = [ "tests" ]

[tool.coverage]
run.branch = true
run.omit = [ "tests/*" ]
run.source_pkgs = [ "wagtailbakery" ]
paths.source = [ "src/wagtailbakery" ]
report.exclude_lines = [
  # Don't complain about abstract methods, they aren't run:
  "@(abc.)?abstractmethod",

  # Don't complain about missing debug-only code:
  "def __repr__",
  "if __name__ == .__main__.:",

  # Don't complain if non-runnable code isn't run:
  "if 0:",
  "if self.debug",

  # Nor complain about type checking
  "if TYPE_CHECKING:",
  # Have to re-enable the standard pragma
  "pragma: no cover",

  # Don't complain if tests don't hit defensive assertion code:
  "raise AssertionError",
  "raise NotImplementedError",
]
report.show_missing = true
